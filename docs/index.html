<script>
/* 첫 페인트 전에 테마를 정합니다 — 없으면 어두운 화면 사용자에게 흰 화면이 번쩍입니다. */
document.documentElement.dataset.theme =
  localStorage.getItem('pyxpad-demo-theme') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<link rel="stylesheet" href="app.css" />

  <span class="grow"></span>
  <button type="button" id="demo-reset">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4M3 4v5h5"/></svg>

<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

  <div style="padding:40px 24px;text-align:center">

    <p><a href="https://github.com/fecu89/pyxpad">GitHub 저장소 보기</a></p>
